name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (CGO + sqlite_fts5)
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet -tags sqlite_fts5 ./...

      - name: Test
        run: CGO_ENABLED=1 go test -tags sqlite_fts5 ./...

      - name: Test (race detector)
        run: CGO_ENABLED=1 go test -tags sqlite_fts5 -race -count=1 ./...
