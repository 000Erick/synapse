name: CI

on:
  push:
    branches: [main]
  pull_request:

# Use bash on every platform (Windows runners default to PowerShell, where the
# inline `CGO_ENABLED=0 go build` syntax is invalid).
defaults:
  run:
    shell: bash

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (pure Go, no CGO)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

  race:
    # Race detector requires CGO; run on Linux and macOS only.
    # Windows + CGO + race is flaky to configure in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test (race detector)
        run: go test -race -count=1 ./...
