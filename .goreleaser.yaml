version: 2

builds:
  - main: ./cmd/synapse
    binary: synapse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^ci"

brews:
  - name: synapse
    repository:
      owner: 000Erick
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/000Erick/synapse
    description: "Semantic vector search for Engram memory — pure Go, MCP-native."
    license: MIT
    install: |
      bin.install "synapse"

scoops:
  - repository:
      owner: 000Erick
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: https://github.com/000Erick/synapse
    description: "Semantic vector search for Engram memory — pure Go, MCP-native."
    license: MIT
